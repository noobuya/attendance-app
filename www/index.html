<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>출결 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="출결 관리">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><h1 id="pageTitle">출결 입력</h1></header>

<main>
  <!-- 출결 입력 -->
  <section id="tab-check" class="tab active">
    <div class="datebar">
      <button class="icon-btn" id="prevDay" aria-label="이전 날">◀</button>
      <input type="date" id="checkDate">
      <button class="icon-btn" id="nextDay" aria-label="다음 날">▶</button>
    </div>
    <div class="chips" id="checkGroupChips"></div>
    <div class="summary-row" id="checkSummary"></div>
    <div class="row-actions">
      <button class="btn small" id="allPresent">전체 출석</button>
      <button class="btn small ghost" id="clearDay">이 날 기록 지우기</button>
    </div>
    <ul class="people-list" id="checkList"></ul>
  </section>

  <!-- 출결표 -->
  <section id="tab-table" class="tab">
    <div class="range card">
      <div class="range-inputs">
        <input type="date" class="rangeFrom"><span>~</span><input type="date" class="rangeTo">
      </div>
      <div class="presets"></div>
    </div>
    <div class="chips" id="tableGroupChips"></div>
    <div class="legend" id="tableLegend"></div>
    <div class="table-wrap"><table id="attTable"></table></div>
    <h3 class="section-title">사람별 합계</h3>
    <div class="table-wrap"><table id="sumTable"></table></div>
    <button class="btn full" id="shareTableImg">이미지로 공유 (카톡 등)</button>
    <button class="btn ghost full" id="exportCsv">CSV로 내보내기</button>
  </section>

  <!-- 그래프 -->
  <section id="tab-stats" class="tab">
    <div class="range card">
      <div class="range-inputs">
        <input type="date" class="rangeFrom"><span>~</span><input type="date" class="rangeTo">
      </div>
      <div class="presets"></div>
    </div>
    <div class="chips" id="statsGroupChips"></div>
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>상태별 비율</h3><canvas id="chartPie" height="220"></canvas></div>
    <div class="card"><h3>날짜별 출석률</h3><canvas id="chartLine" height="220"></canvas></div>
    <div class="card"><h3>그룹별 출결</h3><canvas id="chartGroup" height="240"></canvas></div>
    <div class="card"><h3>사람별 출석률</h3><div id="personChartBox"><canvas id="chartPerson"></canvas></div></div>
    <button class="btn full" id="shareStatsImg">그래프 이미지로 공유 (카톡 등)</button>
  </section>

  <!-- 관리 -->
  <section id="tab-manage" class="tab">
    <div class="card">
      <h3>그룹</h3>
      <form id="groupForm" class="inline-form">
        <input id="groupName" placeholder="새 그룹 이름" maxlength="20" required>
        <button class="btn small">추가</button>
      </form>
      <ul class="manage-list" id="groupList"></ul>
    </div>
    <div class="card">
      <h3>사람</h3>
      <form id="personForm" class="inline-form">
        <input id="personName" placeholder="이름" maxlength="20" required>
        <select id="personGroup"></select>
        <button class="btn small">추가</button>
      </form>
      <ul class="manage-list" id="personList"></ul>
    </div>
    <div class="card">
      <h3>데이터</h3>
      <p class="muted">기록은 이 폰 안에만 저장됩니다. 폰을 바꾸거나 앱을 지우기 전에 백업해 두세요.</p>
      <div class="row-actions">
        <button class="btn small" id="backupBtn">백업 파일 저장</button>
        <label class="btn small ghost">백업 불러오기<input type="file" id="restoreInput" accept="application/json" hidden></label>
      </div>
      <div class="row-actions">
        <button class="btn small ghost" id="sampleBtn">예시 데이터 넣기</button>
        <button class="btn small danger" id="resetBtn">전체 초기화</button>
      </div>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="check" class="active"><span>✔</span>출결 입력</button>
  <button data-tab="table"><span>▦</span>출결표</button>
  <button data-tab="stats"><span>◔</span>그래프</button>
  <button data-tab="manage"><span>⚙</span>관리</button>
</nav>

<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <h3 id="editTitle">수정</h3>
    <input id="editName" maxlength="20" required>
    <select id="editGroup"></select>
    <div class="row-actions end">
      <button class="btn small ghost" value="cancel" formnovalidate>취소</button>
      <button class="btn small" value="ok">저장</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script src="vendor/chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
